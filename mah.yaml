project:
  name: "GTA Labs"
  repo: ~/pro/web/apps/gta-labs

priorities:
  speed: 2
  quality: 1
  cost: 3

agents:
  # Legacy flat format (required by loadConfig)
  generator:
    type: openclaw
    model: sonnet
    cwd: ~/pro/web/apps/gta-labs
  evaluator:
    type: openclaw
    model: sonnet
    workspace: ~/.openclaw/workspace-qa
    testUrl: http://localhost:3001

  # Named agents with skills
  frankie:
    role: generator
    specialty: frontend
    model: sonnet
    defaultSkills: [react-forms, playwright-mobile]
  devin:
    role: generator
    specialty: backend
    model: sonnet
    defaultSkills: [supabase-rls]
  quinn:
    role: evaluator
    specialty: ux
    model: sonnet
    defaultSkills: [playwright-mobile, devils-advocate]
  reese:
    role: researcher
    specialty: research
    model: haiku
    defaultSkills: []
  connie:
    role: generator
    specialty: content
    model: sonnet
    defaultSkills: [blog-writing, humanizer]

qa:
  defaultTier: targeted
  maxIterations: 3
  verdictMode: fail-closed
